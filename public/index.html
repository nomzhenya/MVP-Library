/* =========================================================
   MVP VISION - 100% NEW GALLERY/EDITORIAL LAYOUT
   (Zero JS Logic Modified)
========================================================= */

@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap');

*{box-sizing:border-box}

:root {
  --bg: #050505; 
  --text: #f3f4f6; 
  --muted: #6b7280; 
  --panel: #111111; 
  --panel2: #1f1f22; 
  --border: #27272a; 
  --input: transparent;
  --btn-bg: #1f1f22; 
  --btn-text: #ffffff; 
  --overlay-bg: rgba(5, 5, 5, 0.9); 
  --accent: #10b981; /* Neon Mint */
  --accent-hover: #059669;
  --bato-star: #10b981;
}

body.light {
  --bg: #ffffff; 
  --text: #0f172a; 
  --muted: #64748b; 
  --panel: #f8fafc; 
  --panel2: #f1f5f9; 
  --border: #e2e8f0; 
  --input: transparent;
  --btn-bg: #f1f5f9; 
  --btn-text: #0f172a; 
  --overlay-bg: rgba(255, 255, 255, 0.9); 
  --accent: #0f766e; 
  --accent-hover: #047857;
  --bato-star: #0f766e;
}

html, body {
  margin:0; background:var(--bg); color:var(--text); 
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif; 
  overflow-x:hidden; transition:background .3s,color .3s;
}

/* ANTI-COPY CSS */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}
img{-webkit-user-drag:none;-webkit-touch-callout:none;pointer-events:auto;} 

.wrap { max-width: 800px; margin: auto; padding: 24px 20px; }
#reader.wrap { width: 100vw; max-width: none; margin: 0; padding: 0; overflow-x: hidden; }
#readerContent { width: 100vw; max-width: none; margin: 0 !important; padding: 0; }
@media(max-width: 800px){ #reader.wrap { width: 100vw; } }

/* HEADER OVERRIDES */
header { padding: 12px 0 32px; }
h1, h2, h3, p { margin: 0; }
header h1 { 
    font-size: 32px !important; 
    font-weight: 900 !important; 
    letter-spacing: -1px !important; 
    background: none !important; 
    -webkit-text-fill-color: var(--text) !important; 
    color: var(--text) !important; 
}
header p { font-size: 13px !important; font-weight: 600; color: var(--accent) !important; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px !important; }

/* EDITORIAL SEARCH BAR */
.search-container { position: relative; width: 100%; margin: 10px 0 32px; pointer-events: auto; }
.search { 
    width: 100%; padding: 12px 0; border: none !important; 
    border-bottom: 3px solid var(--border) !important; 
    border-radius: 0 !important; background: transparent !important; 
    color: var(--text) !important; font-size: 22px !important; 
    font-weight: 800 !important; transition: border-color 0.3s; 
}
.search::placeholder { color: var(--muted); opacity: 0.5; font-weight: 600; }
.search:focus { outline: none; border-color: var(--accent) !important; box-shadow: none !important; }

/* SEARCH DROPDOWN */
.search-dropdown { 
  position:absolute; top:calc(100% + 12px); left:0; width:100%; 
  background:var(--bg); border:1px solid var(--border); border-radius:12px; 
  max-height:45vh; overflow-y:auto; z-index:100; box-shadow:0 20px 40px rgba(0,0,0,0.5); display:none; 
}
.search-dropdown.active { display:block; }
.search-item { display:flex; align-items:center; gap:16px; padding:16px; border-bottom:1px solid var(--panel2); cursor:pointer; pointer-events:auto; }
.search-item:last-child { border-bottom:none; }
.search-item img { width:50px; height:50px; object-fit:cover; border-radius:50%; background:var(--panel2); flex:0 0 auto; }
.search-item .info { flex:1; min-width:0; }
.search-item .title { font-size:15px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.search-item .author { font-size:12px; color:var(--accent); font-weight: 700; margin-top:4px; text-transform: uppercase; }

/* MODE SWITCH - MINIMAL PILLS */
.mode-switch { display:flex; gap:12px; background:transparent; padding:0; margin-bottom:32px; box-shadow:none; }
.mode-btn { flex:0 0 auto; padding:10px 24px; border-radius:30px; border:2px solid var(--border); background:transparent; color:var(--muted); font-weight:800; font-size:14px; transition:0.3s; pointer-events:auto; cursor:pointer; }
.mode-btn.active { background:var(--text); border-color:var(--text); color:var(--bg); }

/* SECTIONS */
.b-sec { margin-bottom: 40px; }
.b-head { display:flex; justify-content:space-between; align-items:center; padding-bottom:12px; border-bottom:none; margin-bottom:16px; cursor:pointer; pointer-events:auto; }
.b-title { font-size:20px; font-weight:900; letter-spacing: -0.5px; }
.b-toggle { font-size:16px; font-weight:800; color:var(--accent); width:auto; height:auto; background:transparent; border-radius:0; }
.b-head:active .b-toggle { background:transparent; opacity: 0.7; }

/* =========================================================
   REPURPOSING LIST TO A GALLERY GRID (THE MAGIC!)
========================================================= */
.b-list { 
    display: grid !important; 
    grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)) !important; 
    gap: 20px 16px !important; 
    flex-direction: unset !important; 
}
.b-item { 
    display: flex !important; 
    flex-direction: column !important; 
    gap: 12px !important; 
    background: transparent !important; 
    padding: 0 !important; 
    border: none !important; 
}
.b-cover { 
    width: 100% !important; 
    aspect-ratio: 2/3 !important; 
    border-radius: 12px !important; 
    box-shadow: none !important; 
    border: 1px solid var(--border);
    transition: transform 0.2s;
}
.b-item:active .b-cover { transform: scale(0.96); }
.b-info { padding: 0 !important; gap: 4px !important; }
.b-item-title { font-size: 14px !important; font-weight: 800 !important; line-height: 1.4 !important; margin: 0 !important; }
.b-stats { font-size: 11px !important; color: var(--accent) !important; margin-bottom: 0 !important; }
.b-tags { display: none !important; } /* Hide tags on home gallery for cleanliness */
.b-chaps { margin-top: 4px !important; gap: 4px !important; }
.b-chap { background: var(--panel); padding: 6px 10px; border-radius: 6px; font-size: 11px !important; }
.b-chap-name { color: var(--text) !important; }
.b-chap-meta { color: var(--muted) !important; }

/* POPULAR GRID (Force to match new gallery style) */
.b-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 20px 16px; border-radius: 0; overflow: visible; }
.b-grid-item { aspect-ratio: 2/3; border-radius: 12px; border: 1px solid var(--border); overflow: hidden; }
.b-grid-overlay { background: linear-gradient(transparent, rgba(5,5,5,0.95) 80%); padding: 20px 12px 12px; }
.b-grid-title { font-size: 13px; }
.b-rank { top: 8px; left: 8px; background: var(--text); color: var(--bg); border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; padding: 0; font-size: 12px; box-shadow: none; }

/* BADGES */
.badge-status { top: 8px; right: 8px; background: var(--accent); color: var(--bg); font-weight: 900; padding: 4px 8px; border-radius: 6px; font-size: 10px; box-shadow: none; }
.hidden { display: none !important; }
.notice { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }

/* BUTTONS */
.btn { border: 1px solid var(--border); border-radius: 12px; padding: 12px 20px; background: var(--panel); color: var(--text); font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; font-size: 12px; }
.btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.back { border: 1px solid var(--border); background: transparent; color: var(--text); padding: 10px; border-radius: 50%; font-weight: bold; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }

/* =========================================================
   DETAIL PAGE - CENTERED "BOOK STORE" LOOK
========================================================= */
.mvp-detail-top { 
    display: flex !important; 
    flex-direction: column !important; 
    align-items: center !important; 
    text-align: center !important; 
    gap: 24px !important; 
    margin: 20px 0 32px !important; 
}
.mvp-detail-top .detailcover { 
    width: 220px !important; 
    max-width: 60vw !important;
    aspect-ratio: 2/3 !important; 
    border-radius: 16px !important; 
    box-shadow: 0 24px 48px rgba(0,0,0,0.6) !important; 
    border: 1px solid var(--border);
}
.mvp-detail-top > div { width: 100% !important; flex: none !important; }
.mvp-detail-title { font-size: 28px !important; font-weight: 900 !important; letter-spacing: -1px !important; margin-bottom: 8px !important; line-height: 1.2 !important; }
.mvp-detail-alt { font-size: 14px !important; color: var(--muted) !important; margin-bottom: 12px !important; }
.mvp-detail-author { font-size: 14px !important; color: var(--accent) !important; font-weight: 800 !important; text-transform: uppercase !important; letter-spacing: 1px !important; }
.mvp-detail-stats { justify-content: center !important; gap: 16px !important; margin-top: 20px !important; }
.mvp-detail-stat { background: transparent !important; border: none !important; padding: 0 !important; font-size: 14px !important; gap: 8px !important; }
.mvp-detail-status { justify-content: center !important; margin: 20px 0 0 !important; }
.mvp-detail-chip { background: var(--text) !important; color: var(--bg) !important; border: none !important; padding: 6px 16px !important; border-radius: 20px !important; font-weight: 900 !important; }

/* TAGS */
.mvp-detail-part-title { font-size: 12px; font-weight: 900; letter-spacing: 2px; color: var(--muted); margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
.mvp-detail-tags .tags { justify-content: center; gap: 8px; }
.tag { background: var(--panel) !important; border: 1px solid var(--border) !important; border-radius: 8px !important; padding: 8px 16px !important; font-size: 12px !important; }

/* VOTING - SLEEK BAR */
.mvp-vote-panel { background: transparent !important; border: none !important; padding: 0 !important; margin-top: 32px !important; }
.mvp-vote-top { justify-content: center !important; margin-bottom: 12px !important; }
.mvp-vote-label { font-size: 12px !important; color: var(--muted) !important; }
.mvp-vote-stars { justify-content: center !important; gap: 8px !important; font-size: 28px !important; }
.mvp-rating-summary { display: none !important; } /* Hide complex rating bars for cleaner look */

/* DESCRIPTION */
.mvp-description { font-size: 15px; line-height: 1.8; color: var(--text); padding: 0; background: transparent; text-align: left; }
.mvp-detail-translator { text-align: center !important; margin-bottom: 32px !important; padding: 16px; background: var(--panel); border-radius: 12px; }

/* =========================================================
   CHAPTERS - TILE GRID (BUTTON-LIKE)
========================================================= */
.mvp-chapters-head { border: none !important; margin-top: 40px !important; margin-bottom: 20px !important; }
.mvp-chapters-head h3 { font-size: 20px; font-weight: 900; letter-spacing: -0.5px; }

.chapter-scroll-box { 
    display: grid !important; 
    grid-template-columns: repeat(2, 1fr) !important; /* 2 Columns of tiles */
    gap: 12px !important; 
    background: transparent !important; 
    border: none !important; 
    max-height: 500px;
    padding-right: 4px;
}
.chapter-bato { 
    flex-direction: column !important; 
    align-items: flex-start !important; 
    justify-content: center !important;
    background: var(--panel) !important; 
    border: 1px solid var(--border) !important; 
    border-radius: 12px !important; 
    padding: 16px !important; 
    gap: 6px;
}
.mvp-chapter-bato-body > div:first-child { font-size: 16px !important; font-weight: 900 !important; color: var(--text) !important; }
.mvp-chapter-title { font-size: 12px !important; color: var(--muted) !important; margin-top: 4px !important; }
.mvp-chapter-bato-meta { font-size: 11px !important; color: var(--accent) !important; font-weight: 800 !important; }

@media(max-width: 480px){
    .chapter-scroll-box { grid-template-columns: 1fr !important; } /* 1 column on very small screens */
}

/* =========================================================
   READER - FLOATING ISLAND UI
========================================================= */
.ui-hidden .readerhead { transform: translate(-50%, -150%) !important; opacity: 0; }
.ui-hidden .reader-nav { transform: translate(-50%, 150%) !important; opacity: 0; }

.readerhead { 
    top: 16px !important; left: 50% !important; transform: translateX(-50%) !important; 
    width: 92% !important; max-width: 500px !important; padding: 8px !important; 
    background: rgba(10, 10, 10, 0.85) !important; backdrop-filter: blur(20px) !important; 
    -webkit-backdrop-filter: blur(20px) !important; border: 1px solid rgba(255,255,255,0.1) !important; 
    border-radius: 30px !important; border-bottom: none !important;
}
.reader-info { background: var(--text) !important; color: var(--bg) !important; border-radius: 50% !important; width: 40px !important; height: 40px !important; display: flex; align-items: center; justify-content: center; padding: 0 !important; }
.reader-chapter-btn { background: transparent !important; color: var(--text) !important; font-size: 15px !important; font-weight: 800 !important; }

.reader-nav { 
    bottom: 24px !important; left: 50% !important; transform: translateX(-50%) !important; 
    width: 92% !important; max-width: 500px !important; padding: 12px !important; 
    background: rgba(10, 10, 10, 0.85) !important; backdrop-filter: blur(20px) !important; 
    -webkit-backdrop-filter: blur(20px) !important; border: 1px solid rgba(255,255,255,0.1) !important; 
    border-radius: 24px !important; border-top: none !important;
}
.reader-nav .navbtn { background: transparent !important; border: 1px solid var(--border) !important; border-radius: 12px !important; }
.reader-nav .navbtn.primary { background: var(--accent) !important; color: var(--bg) !important; border: none !important; }

/* MISC FIXES */
.readerpages { background: #000; }
.mvp-lapak-item { border: 1px solid var(--border) !important; border-radius: 12px !important; margin-bottom: 8px !important; padding: 16px !important; background: var(--panel) !important; }
.mvp-translator-card { border-radius: 16px !important; border: 1px solid var(--border) !important; }
.mvp-guest-project { border-radius: 12px !important; }
</style>
</head>
<body oncontextmenu="return false">

<!-- PROGRESS BAR -->
<div id="progressContainer"><div id="progressBar"></div></div>

<script>
  // SORTIR ASC/DESC GLOBAL
  window.chapterSortDesc = true;
  window.toggleChapterSort = function(pid) {
      window.chapterSortDesc = !window.chapterSortDesc;
      openProject(pid);
  };

  // VOTE 1-10 GLOBAL
  window.doVote = async function(pid, score) {
    try {
      var r = await fetch("/api/vote", {method:"POST",headers:Object.assign({"Content-Type":"application/json"},accessHeaders()),body:JSON.stringify({project_id:pid,score:score})});
      var data = await r.json().catch(function(){return {};});
      if(!r.ok) throw new Error(data.error || "vote");
      var p = catalog.find(function(x){return x.id===pid;});
      if(p){p.rating=data.rating;p.votes=data.votes;p.vote_distribution=data.vote_distribution;p.bookmarks=data.bookmarks;p.comments=data.comments;p.user_vote=data.user_vote;p.bookmarked=data.bookmarked;}
      for(var i=1;i<=10;i++){var st=document.getElementById("star_"+pid+"_"+i);if(st){st.textContent=i<=score?"★":"☆";st.style.color=i<=score?"var(--accent)":"var(--border2)";}}
      openProject(pid);
    } catch(e) {
      if(tg && tg.showAlert) tg.showAlert("Vote gagal disimpan."); else alert("Vote gagal disimpan.");
    }
  };

  document.addEventListener('contextmenu', function(e) { if(e.target.tagName==='INPUT')return; e.preventDefault(); });
  document.addEventListener('dragstart', function(e) { e.preventDefault(); });
  document.addEventListener('selectstart', function(e) { if(e.target.tagName!=='INPUT')e.preventDefault(); });
  document.addEventListener('keydown', function(e) {
    if (e.key==='F12' || (e.ctrlKey && e.shiftKey && (e.key==='I'||e.key==='J'||e.key==='C')) || (e.ctrlKey && e.key==='U')) { e.preventDefault(); return false; }
  });
  setInterval(function() {
    var start = performance.now(); debugger; var end = performance.now();
    if (end-start > 100) document.body.innerHTML="<div style='display:flex;height:100vh;align-items:center;justify-content:center;background:#000;color:#ef4444;font-size:20px;text-align:center;padding:20px;font-weight:bold;'>Akses Ilegal Terdeteksi!<br>Sistem Dimatikan.</div>";
  }, 1000);
</script>

<script>
var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
var catalog = [];
var $ = function(id) { return document.getElementById(id); };
var esc = function(s) { return String(s != null ? s : "").replace(/[&<>"']/g, function(m) { return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]); }); };
var API_BASE = location.origin;
var fileUrl = function(fileId) { return API_BASE + "/api/file?file_id=" + encodeURIComponent(fileId) + "&init_data=" + encodeURIComponent((tg && tg.initData) ? tg.initData : ""); };

var accessUser = null;
var accessDenied = false;
var currentMode = "comic";
var uiTimeout;

var decBadge = function(d) { return Number(d) === 1 ? " [Decensored]" : (Number(d) === 2 ? " [Uncensored]" : ""); };

// WAKTU BACA DARI DATABASE
function timeAgo(ts) {
  if (!ts) return "Just now";
  var seconds = Math.floor((Date.now() / 1000) - ts);
  if (seconds < 60) return "Just now";
  var minutes = Math.floor(seconds / 60);
  if (minutes < 60) return minutes + " mins ago";
  var hours = Math.floor(minutes / 60);
  if (hours < 24) return hours + " hours ago";
  var days = Math.floor(hours / 24);
  return days + " days ago";
}

function getTags(p) { 
  var arr = Array.isArray(p.tags) ? p.tags.filter(function(t){ return t && isNaN(Number(t)); }) : []; 
  return arr.length ? esc(arr.join(", ")) : ""; 
}

function accessHeaders(){ return {"X-Telegram-Init-Data": (tg && tg.initData) ? tg.initData : ""}; }
function showDenied(){
  accessDenied=true; $("home").classList.add("hidden"); $("detail").classList.add("hidden"); $("reader").classList.add("hidden"); 
  $("gate").innerHTML="<div><h2>🔒 Akses Ditolak</h2><p class='muted' style='margin-top:8px'>Silakan buka melalui aplikasi Telegram Android/iOS.</p></div>";
  $("gate").classList.remove("hidden");
}

async function requireAccess(){
  if(accessDenied) return false;
  try {
      var r = await fetch("/api/access",{cache:"no-store",headers:accessHeaders()});
      var data = await r.json().catch(function(){ return {}; });
      if(r.status===403 || r.status===401) { 
        accessDenied=true; $("home").classList.add("hidden"); $("detail").classList.add("hidden"); $("reader").classList.add("hidden");
        $("gate").innerHTML="<div><h2>🔒 Akses Ditolak</h2><p class='muted' style='margin-top:8px'>Anda bukan bagian dari MVP.</p><button class='btn primary' style='margin-top:16px' onclick='if(tg) tg.close()'>Tutup</button></div>";
        $("gate").classList.remove("hidden"); 
        return false; 
      }
      if(!r.ok) throw new Error(data.reason || "access");
      accessUser = data.user || null;
      return true;
  } catch(e) { return false; }
}

function isBookmark(id) {
  var p=catalog.find(function(x){return x.id===id;});
  return !!(p && p.bookmarked === true);
}
async function toggleBookmark(id) {
  var p=catalog.find(function(x){return x.id===id;});
  var next=!(p && p.bookmarked===true);
  try{
    var r=await fetch("/api/bookmark",{method:"POST",headers:Object.assign({"Content-Type":"application/json"},accessHeaders()),body:JSON.stringify({project_id:id,bookmarked:next})});
    var data=await r.json().catch(function(){return {};});
    if(!r.ok) throw new Error(data.error||"bookmark");
    if(p){p.rating=data.rating;p.votes=data.votes;p.vote_distribution=data.vote_distribution;p.bookmarks=data.bookmarks;p.comments=data.comments;p.user_vote=data.user_vote;p.bookmarked=data.bookmarked;}
    if(!$('detail').classList.contains('hidden')) openProject(id); else renderHome();
  }catch(e){if(tg&&tg.showAlert)tg.showAlert("Bookmark gagal disimpan.");}
}
function saveHistory(pid, ch, dec) {
  try{ var h=JSON.parse(localStorage.getItem("mvp_history")||"{}"); h[pid]={chapter:ch, decensored:Number(dec), ts:Date.now()}; localStorage.setItem("mvp_history",JSON.stringify(h)); }catch(e){}
}
function getHistory() { try{ return JSON.parse(localStorage.getItem("mvp_history")||"{}"); }catch(e){return {};} }

function normalizeType(p){ return String(p && p.type||"comic").toLowerCase()==="novel"?"novel":"comic"; }
function projectLatestChapter(p){
  var chs = Array.isArray(p && p.chapters)?p.chapters:[]; var best=null;
  chs.forEach(function(c,i){ var ts=Number(c.updated_at||0); if(!best || ts>best.ts) best={chapter:c,i:i,ts:ts}; });
  return best;
}
function getSortedProjects() {
  return catalog.filter(function(p){ return normalizeType(p)===currentMode; }).map(function(p){
    var l=projectLatestChapter(p); return l && l.chapter.chapter ? {p:p, latest:l} : null;
  }).filter(Boolean).sort(function(a,b){ return b.latest.ts - a.latest.ts; });
}


function normalizeTagKey(tag){
  return String(tag||"").trim().toLowerCase().replace(/\s+/g," ").replace(/[()_\-]/g,"");
}
function tagPriority(tag){
  var k=normalizeTagKey(tag);
  if(k==="manhwa" || k==="manga" || k==="manhua") return 0;
  if(k==="yaoi" || k==="yaoibl" || k==="shounenai" || k==="shounen ai") return 1;
  return 2;
}
function sortedTags(tags){
  var seen={};
  return (Array.isArray(tags)?tags:[]).map(function(t){return String(t||"").trim();})
    .filter(function(t){return t && isNaN(Number(t));})
    .filter(function(t){var k=normalizeTagKey(t);if(seen[k])return false;seen[k]=true;return true;})
    .sort(function(a,b){
      var pa=tagPriority(a), pb=tagPriority(b);
      if(pa!==pb) return pa-pb;
      return a.localeCompare(b,undefined,{sensitivity:"base"});
    });
}
function allUsedTags(mode){
  var map={};
  catalog.forEach(function(p){
    if(mode && normalizeType(p)!==mode) return;
    sortedTags(p.tags).forEach(function(t){
      var k=normalizeTagKey(t);
      if(!map[k]) map[k]=t;
    });
  });
  return Object.keys(map).map(function(k){return map[k];}).sort(function(a,b){
    var pa=tagPriority(a), pb=tagPriority(b);
    if(pa!==pb) return pa-pb;
    return a.localeCompare(b,undefined,{sensitivity:"base"});
  });
}
function tagButtonHtml(tag, extraClass){
  var cls="tag "+(tagPriority(tag)===0?"tag-major ":(tagPriority(tag)===1?"tag-secondary ":""))+(extraClass||"");
  return "<button type='button' class='"+cls+"' onclick=\"event.stopPropagation();openTagBrowse('"+esc(tag).replace(/'/g,"&#39;")+"')\">"+esc(tag)+"</button>";
}
var browseMode=currentMode;
var browseSelectedTag="";
var browseSelectedStatus="";
function normalizeStatusKey(status){
  var k=String(status||"").trim().toLowerCase();
  if(k==="completed"||k==="complete"||k==="tamat"||k==="finished"||k==="finish") return "completed";
  if(k==="ongoing"||k==="on-going"||k==="berjalan") return "ongoing";
  return k;
}
function statusLabel(status){return normalizeStatusKey(status)==="completed"?"Completed":"Ongoing";}
function projectMatchesStatus(p,status){var key=normalizeStatusKey(status);return !key||normalizeStatusKey(p.status)===key;}
function renderBrowseTags(){
  var cloud=$("browseTagCloud");if(!cloud)return;
  var tags=allUsedTags(browseMode);
  cloud.innerHTML=tags.length?tags.map(function(t){var active=!browseSelectedStatus&&normalizeTagKey(t)===normalizeTagKey(browseSelectedTag);return "<button type='button' class='mvp-tag-link "+(tagPriority(t)===0?"major ":"")+(tagPriority(t)===1?"secondary ":"")+(active?" active":"")+"' onclick=\"openTagBrowse('"+esc(t).replace(/'/g,"&#39;")+"')\">"+esc(t)+"</button>";}).join(""):"<div class='mvp-empty-state'>Belum ada tag pada mode ini.</div>";
  var sf=$("browseStatusFilter");if(sf){sf.innerHTML="<div class='mvp-status-filter-label'>Status</div>"+["ongoing","completed"].map(function(x){var active=!browseSelectedTag&&browseSelectedStatus===x;return "<button type='button' class='mvp-tag-link status "+x+(active?" active":"")+"' onclick=\"openStatusBrowse('"+x+"')\">"+statusLabel(x)+"</button>";}).join("");}
}
function renderBrowseResults(){
  var out=$("browseResults");if(!out)return;
  var list=catalog.filter(function(p){if(normalizeType(p)!==browseMode)return false;if(browseSelectedStatus)return projectMatchesStatus(p,browseSelectedStatus);if(!browseSelectedTag)return false;return sortedTags(p.tags).some(function(t){return normalizeTagKey(t)===normalizeTagKey(browseSelectedTag);});}).sort(function(a,b){return String(a.title||"").localeCompare(String(b.title||""),undefined,{sensitivity:"base"});});
  var label=browseSelectedStatus?statusLabel(browseSelectedStatus):(browseSelectedTag?browseSelectedTag:"Pilih tag atau status");
  out.innerHTML="<div class='mvp-browse-results-head'><div class='mvp-browse-results-title'>"+esc(label)+"</div><div class='mvp-browse-count'>"+list.length+" project</div></div>"+(list.length?"<div class='b-list'>"+list.map(function(p){return renderBatoItem(p,[]);}).join("")+"</div>":"<div class='mvp-empty-state'>Tidak ada project dengan filter ini.</div>");
}
function setBrowseMode(mode){browseMode=mode;$("browseModeComic").classList.toggle("active",mode==="comic");$("browseModeNovel").classList.toggle("active",mode==="novel");browseSelectedTag="";browseSelectedStatus="";renderBrowseTags();renderBrowseResults();}
function hideHomeForPage(){
  $("home").classList.add("hidden");
  $("detail").classList.add("hidden");
  $("catalogLayer").classList.remove("active");
  $("browseLayer").classList.remove("active");
  $("browseLayer").classList.add("hidden");
  $("lapakLayer").classList.remove("hidden");
  $("guestLayer").classList.remove("active");
  $("guestLayer").classList.add("hidden");
}

function openLapakList(){
  hideHomeForPage();
  $("lapakLayer").classList.remove("hidden");
  $("lapakLayer").classList.add("active");
  renderLapakList();
  window.scrollTo(0,0);

function closeLapakList(){
  $("lapakLayer").classList.remove("active");
  $("lapakLayer").classList.add("hidden");
  $("home").classList.remove("hidden");
  window.scrollTo(0,0);
}
function renderLapakList(){
  var target=$("lapakListContent");
  if(!target)return;
  var projects=catalog.slice().sort(function(a,b){
    return String(a.title||"").localeCompare(String(b.title||""),undefined,{sensitivity:"base"});
  });
  if(!projects.length){
    target.innerHTML="<p class='muted' style='font-size:14px;text-align:center;padding:20px 0;'>Belum ada project.</p>";
    return;
  }
  var groups={};
  projects.forEach(function(p){
    var letter=(String(p.title||"?").trim().charAt(0)||"?").toUpperCase();
    if(!groups[letter])groups[letter]=[];
    groups[letter].push(p);
  });
  target.innerHTML=Object.keys(groups).sort().map(function(letter){
    return `<div class="mvp-lapak-letter">${esc(letter)}</div>`+
      groups[letter].map(function(p){
        var pType = normalizeType(p);
        var typeBadge = pType === 'novel' 
          ? `<span style="font-size:10px; background:var(--accent2); color:#fff; padding:2px 6px; border-radius:4px; margin-left:8px; font-weight:800;">NOVEL</span>` 
          : `<span style="font-size:10px; background:var(--accent); color:#fff; padding:2px 6px; border-radius:4px; margin-left:8px; font-weight:800;">COMIC</span>`;
        return `<button type="button" class="mvp-lapak-item" onclick="openProjectFromLapak('${esc(p.id)}')"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(p.title)}</span>${typeBadge}</button>`;
      }).join("");
  }).join("");
}
function openProjectFromLapak(id){
  $("lapakLayer").classList.remove("active");
  $("lapakLayer").classList.add("hidden");
  openProject(id);
}
function guestTranslatorMap(){
  var map={};
  catalog.forEach(function(p){
    var name=String(p.translator||"").trim();
    if(!name || name.toLowerCase()==="mvp")return;
    var key=name.toLowerCase();
    if(!map[key])map[key]={name:name,projects:[],url:"",label:"Traktir Kopi"};
    if(!map[key].projects.some(function(x){return x.id===p.id;}))map[key].projects.push(p);
    if(!map[key].url&&p.trakteer)map[key].url=p.trakteer;
    if(p.trakteer_label)map[key].label=p.trakteer_label;
  });
  return Object.keys(map).map(function(k){return map[k];}).sort(function(a,b){
    return a.name.localeCompare(b.name,undefined,{sensitivity:"base"});
  });
}
function openGuestPage(){
  $("home").classList.add("hidden");
  $("detail").classList.add("hidden");
  $("reader").classList.add("hidden");
  $("browseLayer").classList.remove("active"); $("browseLayer").classList.add("hidden");
  $("catalogLayer").classList.remove("active"); $("catalogLayer").classList.add("hidden");
  $("lapakLayer").classList.remove("active"); $("lapakLayer").classList.add("hidden");
  $("guestLayer").classList.remove("hidden"); $("guestLayer").classList.add("active");

  $("guestLayer").classList.remove("active");
  $("guestLayer").classList.add("hidden");
  $("home").classList.remove("hidden");
  window.scrollTo(0,0);
}
function renderGuestPage(){
  var target=$("guestListContent");
  if(!target)return;
  var list=guestTranslatorMap();
  target.innerHTML=list.length?list.map(function(t){
    var support=t.url?`<a class="mvp-support-btn" href="${esc(t.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">☕ ${esc(t.label||"Traktir Kopi")}</a>`:"";
    return `<article class="mvp-translator-card" onclick="openTranslatorProfile('${esc(t.name)}')">
      <div class="mvp-translator-head">
        <div class="mvp-translator-name">${esc(t.name)}</div>
        <div class="mvp-translator-count">${t.projects.length} project${t.projects.length===1?"":"s"}</div>
      </div>
      <div class="mvp-translator-actions">${support}</div>
    </article>`;
  }).join(""):"<p class='muted' style='font-size:14px;text-align:center;padding:20px 0;'>Belum ada guest translator.</p>";
}

function openBrowse(tag){$("lapakLayer").classList.remove("active");$("lapakLayer").classList.add("hidden");$("guestLayer").classList.remove("active");$("guestLayer").classList.add("hidden");browseMode=currentMode;browseSelectedTag=tag||"";browseSelectedStatus="";$("home").classList.add("hidden");$("detail").classList.add("hidden");$("catalogLayer").classList.remove("active");$("browseLayer").classList.remove("hidden");$("browseLayer").classList.add("active");$("browseModeComic").classList.toggle("active",browseMode==="comic");$("browseModeNovel").classList.toggle("active",browseMode==="novel");renderBrowseTags();renderBrowseResults();window.scrollTo(0,0);}
function openTagBrowse(tag){openBrowse(tag);}
function openStatusBrowse(status){browseMode=currentMode;browseSelectedTag="";browseSelectedStatus=normalizeStatusKey(status);$("home").classList.add("hidden");$("detail").classList.add("hidden");$("catalogLayer").classList.remove("active");$("browseLayer").classList.remove("hidden");$("browseLayer").classList.add("active");$("browseModeComic").classList.toggle("active",browseMode==="comic");$("browseModeNovel").classList.toggle("active",browseMode==="novel");renderBrowseTags();renderBrowseResults();window.scrollTo(0,0);}
function closeBrowse(){$("browseLayer").classList.remove("active");$("browseLayer").classList.add("hidden");$("home").classList.remove("hidden");window.scrollTo(0,0);}

// UI LOGIC
function setMode(mode) {

  var bC = $('btnModeComic'); var bN = $('btnModeNovel');
  if(bC) bC.classList.toggle('active', mode==='comic');

function toggleSec(id, btn) {

  if(el && el.classList.contains('hidden')) { el.classList.remove('hidden'); btn.querySelector('.b-toggle').textContent = "Lihat Semua"; } 
  else if(el) { el.classList.add('hidden'); btn.querySelector('.b-toggle').textContent = "Tampilkan"; }
}

// FORMAT BATO LIST DENGAN STATS DARI DATABASE
function chapterDisplayTitle(ch){return String(ch&&(ch.chapter_title||ch.title||ch.name)||"").trim();}
function chapterTranslator(p,ch){
  var t=String((ch&&ch.translator)||"").trim();
  if(t) return t;
  var pt=String((p&&p.translator)||"").trim();
  return pt || "MVP";
}
function renderBatoItem(p,chaptersToShow,homeContext){
  var cover=p.cover_file_id?`<img class="b-cover" src="${fileUrl(p.cover_file_id)}" loading="lazy">`:`<div class="b-cover"></div>`;
  var pRating=(p.rating!=null?Number(p.rating).toFixed(1):"0.0"),pBookmarks=p.bookmarks||"0",pComments=Number(p.comments||0);
  var chHtml=(chaptersToShow||[]).map(function(ch){
    var timeStr=ch.updated_at?timeAgo(ch.updated_at):(ch.ts?timeAgo(Math.floor(ch.ts/1000)):"Just now"),title=chapterDisplayTitle(ch),trans=chapterTranslator(p,ch);
    return `<div class="b-chap" onclick="event.stopPropagation();openReader('${esc(p.id)}','${esc(ch.chapter)}',${Number(ch.decensored||0)})"><div style="min-width:0;flex:1"><div class="b-chap-name">Ch. ${esc(ch.chapter)}${decBadge(ch.decensored)}</div>${title?`<div class="mvp-chapter-title">${esc(title)}</div>`:""}</div><div class="b-chap-meta">${timeStr}</div></div>`;
  }).join("");
  var homeLines=homeContext?`<div class="mvp-home-history">${homeContext.history?`<div class="mvp-home-line history" onclick="event.stopPropagation();openReader('${esc(p.id)}','${esc(homeContext.history.chapter)}',${Number(homeContext.history.decensored||0)})" style="cursor:pointer; display:none;"><span class="label">↻ Terakhir dibaca</span><div class="value">Ch. ${esc(homeContext.history.chapter)}${chapterDisplayTitle(homeContext.history)?` · ${esc(chapterDisplayTitle(homeContext.history))}`:""} · ${timeAgo(Math.floor(Number(homeContext.history.ts||0)/1000))}</div></div>`:""}${homeContext.latest?`<div class="b-chap latest" onclick="event.stopPropagation();openReader('${esc(p.id)}','${esc(homeContext.latest.chapter)}',${Number(homeContext.latest.decensored||0)})" style="cursor:pointer;"><div style="min-width:0;flex:1"><div class="b-chap-name">Ch. ${esc(homeContext.latest.chapter)}${decBadge(homeContext.latest.decensored)}</div>${chapterDisplayTitle(homeContext.latest)?`<div class="mvp-chapter-title">${esc(chapterDisplayTitle(homeContext.latest))}</div>`:""}</div><div class="b-chap-meta">${timeAgo(Number(homeContext.latest.updated_at||0))}</div></div>`:""}</div>`:`<div class="b-chaps">${chHtml}</div>`;
  return `<div class="b-item" onclick="openProject('${esc(p.id)}')">${cover}<div class="b-info"><div class="b-item-title"><span class="txt">${esc(p.title)}</span></div><div class="b-stats"><span>★ ${pRating}</span> | <span>💬 ${pComments}</span></div><div class="b-tags">${getTags(p)}</div>${homeLines}</div></div>`;
}
function translatorName(project){
  var name = String((project && (project.translator || project.TRANSLATOR)) || "").trim();
  if(!name){
    return "<span class='mvp-translator'>MVP</span>";
  }
  return "<button type='button' class='guest-translator-link translator-gradient-all' data-guest='"+esc(name)+"'>"+esc(name)+"</button>";
}

function renderHome(){
  var all=getSortedProjects(), histObj=getHistory();
  var myUpdates=all.filter(function(item){return isBookmark(item.p.id);}).slice(0,10);
  var updatesTarget=$("secUpdates");
  if(updatesTarget){
    updatesTarget.innerHTML=myUpdates.length
      ?myUpdates.map(function(item){return renderBatoItem(item.p,[],{history:histObj[item.p.id]||null,latest:item.latest?item.latest.chapter:null});}).join("")
      :"<p class='muted' style='font-size:14px;text-align:center;padding:20px 0; grid-column: 1 / -1;'>Belum ada update bookmark.</p>";
  }

  var histArr=Object.keys(histObj).map(function(pid){var o=histObj[pid];o.pid=pid;return o;}).sort(function(a,b){return b.ts-a.ts;});
  var myHist=histArr.map(function(h){
    var p=catalog.find(function(x){return x.id===h.pid&&normalizeType(x)===currentMode;});
    if(!p)return null;
    var latest=projectLatestChapter(p);
    return {p:p,hist:h,latest:latest?latest.chapter:null};
  }).filter(Boolean).slice(0,10);

  var historyTarget=$("secHistory");
  if(historyTarget){
    historyTarget.innerHTML=myHist.length
      ?myHist.map(function(item){return renderBatoItem(item.p,[],{history:item.hist,latest:item.latest});}).join("")
      :"<p class='muted' style='font-size:14px;text-align:center;padding:20px 0; grid-column: 1 / -1;'>Belum ada riwayat.</p>";
  }

  var popular=all.slice().sort(function(){return Math.random()-0.5;}).slice(0,10);
  $("secPopular").innerHTML=popular.map(function(item,i){
    var tamatBadge=(normalizeStatusKey(item.p.status)==="completed")?"<div class='badge-status badge-tamat'>Completed</div>":"";
    var coverHtml=item.p.cover_file_id?"<img src='"+fileUrl(item.p.cover_file_id)+"' loading='lazy'>":"";
    return `<div class="b-grid-item" onclick="openReader('${esc(item.p.id)}','${esc(item.latest.chapter.chapter)}',${Number(item.latest.chapter.decensored||0)})">${tamatBadge}<div class="b-rank">${i+1}</div>${coverHtml}<div class="b-grid-overlay"><div class="b-grid-title">${esc(item.p.title)}</div><div class="b-grid-ch">Ch.${esc(item.latest.chapter.chapter)}</div></div></div>`;
  }).join("");

  $("secLatest").innerHTML=all.slice(0,16).map(function(item){return renderBatoItem(item.p,[item.latest.chapter]);}).join("");
}

// DROPDOWN SEARCH LOGIC PADA HOMEPAGE
function executeSearch(val) {
  if(!val || !val.trim()) return;
  var mainSearch = $("search");
  if(mainSearch) {
    mainSearch.value = val;
    var dd = $("searchDropdown");
    if(dd) dd.classList.remove("active");
    $("homeLayer").classList.remove("active");
    $("catalogLayer").classList.add("active");
    
    var res = catalog.filter(function(p){
      return normalizeType(p)===currentMode && ((p.title||"").toLowerCase().includes(val.toLowerCase()) || (p.author||"").toLowerCase().includes(val.toLowerCase()));
    });
    $('searchGrid').innerHTML = res.length ? res.map(function(p){
      var l=projectLatestChapter(p); return renderBatoItem(p, l?[l.chapter]:[]);
    }).join("") : "<p class='muted' style='text-align:center; grid-column: 1/-1;'>Tidak ditemukan.</p>";
  }
}

if($("search")) {
  $("search").addEventListener("input", function(e) {
    var val = this.value.trim().toLowerCase();
    var dd = $("searchDropdown");
    if(!dd) return;
    if(val === "") { dd.classList.remove("active"); return; }
    
    var matches = catalog.filter(function(p) {
      var t = String((p && p.title) || "").toLowerCase();
      var a = String((p && p.author) || "").toLowerCase();
      return t.includes(val) || a.includes(val);
    }).slice(0, 8); 

    if(matches.length === 0) {
      dd.innerHTML = "<div style='padding:16px; text-align:center; color:var(--muted); font-size:14px;'>Tidak ada hasil untuk \"" + esc(val) + "\"</div>";
    } else {
      dd.innerHTML = matches.map(function(p) {
        var imgHtml = p.cover_file_id ? "<img src='"+fileUrl(p.cover_file_id)+"' loading='lazy'>" : "<div style='width:45px;height:65px;background:var(--panel2);border-radius:8px;flex:0 0 auto;'></div>";

          imgHtml +
          "<div class='info'><div class='title'>"+esc(p.title)+"</div>"+authorHtml+"</div>" +
        "</div>";
      }).join("");
    }
    dd.classList.add("active");
  });

  $("search").addEventListener("keydown", function(e) {
    if(e.key === "Enter") { e.preventDefault(); executeSearch(this.value.trim()); this.blur(); }
  });

  document.addEventListener("click", function(e) {
    var container = $("mainSearchContainer");
    if(container && !container.contains(e.target)) {
      var dd = $("searchDropdown");
      if (dd) dd.classList.remove("active");
    }
  });
}

function handleDetailSearch(val) {
  val = val.trim().toLowerCase();

  if(val === "") { dd.classList.remove("active"); return; }
  var matches = catalog.filter(function(p) {
    var t = String((p && p.title) || "").toLowerCase();
    var a = String((p && p.author) || "").toLowerCase();
    return t.includes(val) || a.includes(val);
  }).slice(0, 8);
  if(matches.length === 0) {
    dd.innerHTML = "<div style='padding:16px; text-align:center; color:var(--muted); font-size:14px;'>Tidak ada hasil untuk \"" + esc(val) + "\"</div>";
  } else {
    dd.innerHTML = matches.map(function(p) {
      var imgHtml = p.cover_file_id ? "<img src='"+fileUrl(p.cover_file_id)+"' loading='lazy'>" : "<div style='width:45px;height:65px;background:var(--panel2);border-radius:8px;flex:0 0 auto;'></div>";

// LOGIKA SCROLL: Progress bar & Auto-hide UI
window.addEventListener('scroll', function() {
  if (!$("reader").classList.contains("hidden")) {
    var winScroll = document.body.scrollTop || document.documentElement.scrollTop;
    var height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
    if (height > 0) {
      var scrolled = (winScroll / height) * 100;
      $("progressBar").style.width = scrolled + "%";
    }
    
    if ((document.body.scrollTop || document.documentElement.scrollTop) > 15 && !$("reader").classList.contains("ui-hidden")) {
      var menu = $("readerChapterMenu");
      if (!menu || menu.classList.contains("hidden")) {
        $("reader").classList.add("ui-hidden");
        if(typeof uiTimeout !== 'undefined') clearTimeout(uiTimeout);
      }
    }
  }
});

function getTelegramIdentity(){
  var user = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user : null;
  if(!user) return {id:"", username:""};
  return { id: String(user.id || ""), username: user.username ? ("@" + user.username) : "" };
}

function showReaderWatermark(){
  var u = getTelegramIdentity();
  var parts = [];
  if (u.id) parts.push(u.id);
  if (u.username) parts.push(u.username);
  $("readerWatermarkUser").textContent = parts.join(" | ");
  $("readerWatermark").classList.remove("hidden");
}

function hideReaderWatermark(){
  $("readerWatermark").classList.add("hidden");
}

function chapterIndex(projectId, chapterName, decensored){
  var p = catalog.find(function(x) { return x.id === projectId; });
  if(!p) return -1;
  var chaptersArr = Array.isArray(p && p.chapters) ? p.chapters : [];
  return chaptersArr.findIndex(function(c) { return String(c.chapter) === String(chapterName) && Number(c.decensored) === Number(decensored); });
}

async function openChapter(projectId, index){
  if(!(await requireAccess())) return;
  var p = catalog.find(function(x) { return x.id === projectId; });
  if(!p) return;
  var chaptersArr = Array.isArray(p && p.chapters) ? p.chapters : [];
  if(!chaptersArr[index]) return;
  var c = chaptersArr[index];
  openReader(projectId, c.chapter, Number(c.decensored));
}

function chapterCommentLink(p){
  return (p && p.comment_link) || "";
}

function showReaderUI() {
    $("reader").classList.remove("ui-hidden");
    clearTimeout(uiTimeout);
    uiTimeout = setTimeout(function() {
        var menu = $("readerChapterMenu");
        var isMenuOpen = menu && !menu.classList.contains("hidden");
        if (!isMenuOpen && !$("reader").classList.contains("hidden")) {
            $("reader").classList.add("ui-hidden");
        }
    }, 3500); 
}

function toggleReaderUI(e) {
  if(e && e.target && (e.target.closest('button') || e.target.closest('a') || e.target.closest('.readerhead') || e.target.closest('.reader-nav') || e.target.closest('input'))) return;
  
  if ($("reader").classList.contains("ui-hidden")) {
      showReaderUI();
  } else {
      $("reader").classList.add("ui-hidden");
      clearTimeout(uiTimeout);
  }
}

function changeFontSize(dir, e) {
  if (e) e.stopPropagation(); 
  var currentFontSize = Number(localStorage.getItem('mvp_fontsize')) || 17;
  currentFontSize += (dir * 2);
  if (currentFontSize < 12) currentFontSize = 12;
  if (currentFontSize > 32) currentFontSize = 32;
  localStorage.setItem('mvp_fontsize', currentFontSize);
  var reader = document.querySelector('.novel-reader');
  if (reader) reader.style.fontSize = currentFontSize + 'px';
}

// LOGIKA OPEN READER
async function openReader(projectId, chapterName, decensored){
  if(!(await requireAccess())) return;
  
  var p = catalog.find(function(x) { return x.id === projectId; });
  if(!p) return;
  var idx = chapterIndex(projectId, chapterName, decensored);
  var chaptersArr = Array.isArray(p && p.chapters) ? p.chapters : [];
  var c = chaptersArr[idx];
  if(!c) return;

  var platform = String((tg && tg.platform) || "").toLowerCase();
  if (Number(c.decensored) === 1 && platform !== "android" && platform !== "android_x") {
      alert("Akses ditolak!\nChapter Decensored hanya tersedia di Android");
      return;
  }

  saveHistory(projectId, c.chapter, Number(c.decensored));
  $("progressContainer").style.display="block";
  $("progressBar").style.width="0%";

  $("home").classList.add("hidden");
  $("detail").classList.add("hidden");
  $("reader").classList.remove("hidden");
  $("reader").classList.remove("ui-hidden"); 
  showReaderWatermark();

  var chapterOptions = chaptersArr.map(function(ch, i) {
    var isCur = i === idx ? "current" : "";
    return "<button class='reader-chapter-option "+isCur+"' onclick=\"selectReaderChapter('"+esc(p.id)+"',"+i+")\">Chapter "+esc(ch.chapter)+decBadge(ch.decensored)+(chapterDisplayTitle(ch)?" · "+esc(chapterDisplayTitle(ch)):"")+"</button>";
  }).join("");

  var isLast = idx >= chaptersArr.length - 1;
  var btnNextAction = isLast ? "closeReader()" : "openChapter('"+esc(p.id)+"',"+(idx+1)+")";
  var btnNextText = isLast ? "Selesai" : "Lanjut »";
  var btnNextClass = isLast ? "" : "primary";

  var topNav = 
    "<div class='readerhead'>" +
      "<div class='reader-topbar'>" +
        "<button class='reader-info' onclick=\"readerInfo('"+esc(p.id)+"')\">" +
            "<svg width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><line x1='19' y1='12' x2='5' y2='12'></line><polyline points='12 19 5 12 12 5'></polyline></svg>" +
        "</button>" +
        "<div class='reader-chapter-wrap'>" +
          "<button id='readerChapterButton' class='reader-chapter-btn' onclick='toggleChapterMenu(event)'>" +
            "Ch. "+esc(c.chapter)+decBadge(c.decensored) +
          "</button>" +
          "<div id='readerChapterMenu' class='reader-chapter-menu hidden'>" + chapterOptions + "</div>" +
        "</div>" +
      "</div>" +
    "</div>";

  var commentUrl = chapterCommentLink(p);
  var btnPrevClass = idx <= 0 ? "disabled" : "";
  var commentBtnHtml = commentUrl 
    ? "<div class='reader-nav-row' style='margin-top:2px;'><button class='navbtn commentbtn' style='width:100%; border:none; background:transparent; color:var(--accent); font-weight:900;' onclick=\"location.href='"+esc(commentUrl)+"'\">💬 Buka Kolom Komentar</button></div>" 
    : "";

  var fontBtns = c.content_type === "docx" 
    ? "<div class='reader-nav-row' style='margin-bottom:6px;'><button class='navbtn' onclick='changeFontSize(-1, event)'>A-</button><button class='navbtn' onclick='changeFontSize(1, event)'>A+</button></div>" 
    : "";

  var botNav = 
    "<div id='readerNav' class='reader-nav'>" +
      fontBtns +
      "<div class='reader-nav-row'>" +
        "<button class='navbtn "+btnPrevClass+"' "+btnPrevClass+" onclick=\"openChapter('"+esc(p.id)+"',"+(idx-1)+")\">« Prev</button>" +
        "<button class='navbtn upbtn' onclick=\"window.scrollTo({top:0,behavior:'smooth'})\">↑ Atas</button>" +
        "<button class='navbtn "+btnNextClass+"' onclick=\""+btnNextAction+"\">"+btnNextText+"</button>" +
      "</div>" +
      commentBtnHtml +
    "</div>";

  $("readerContent").innerHTML = topNav + "<div id='readerPages' class='readerpages' onclick='toggleReaderUI(event)'></div>" + botNav;
  var pages = $("readerPages");

  if(c && c.content_type === "docx"){
    pages.innerHTML = "<div class='novel-loading'>Memuat chapter…</div>";
    try {
      var r = await fetch("/api/novel?project_id=" + encodeURIComponent(projectId) + "&chapter=" + encodeURIComponent(c.chapter) + "&decensored=" + c.decensored, {cache:"no-store",headers:accessHeaders()});
      if(!r.ok) throw new Error("novel");
      var data = await r.json();
      var savedFont = Number(localStorage.getItem('mvp_fontsize')) || 17;
      pages.innerHTML = "<article class='novel-reader' style='font-size:"+savedFont+"px'>" + ((data && data.html) ? data.html : "<p class='muted'>Chapter kosong.</p>") + "</article>";
        
      setTimeout(function() {
          if (!$('mvpMarkHint')) { var hint=document.createElement('div'); hint.id='mvpMarkHint'; hint.className='mvp-mark-hint'; hint.textContent='Tahan paragraf untuk menandai'; document.body.appendChild(hint); setTimeout(function(){hint.classList.add('show');},80); setTimeout(function(){hint.classList.remove('show');},2300); }
          var paragraphs = document.querySelectorAll('.novel-reader p');
          var saveKey = 'mvp_novel_mark_' + projectId + '_' + c.chapter + '_' + Number(c.decensored||0);
          var savedIndex = localStorage.getItem(saveKey);

          var markTimer=null, markTarget=null, holdFired=false, holdX=0, holdY=0;
          var HOLD_MS=550;
          var markParagraph=function(p,pIdx){
              document.querySelectorAll('.novel-reader p.bookmarked').forEach(function(el){if(el!==p)el.classList.remove('bookmarked');});
              if(p.classList.contains('bookmarked')){p.classList.remove('bookmarked');localStorage.removeItem(saveKey);}
              else{p.classList.add('bookmarked');localStorage.setItem(saveKey,pIdx);}
          };
          var clearHold=function(p){if(markTimer){clearTimeout(markTimer);markTimer=null;}if(p)p.classList.remove('mvp-hold-armed');markTarget=null;};
          paragraphs.forEach(function(p,pIdx){
              p.addEventListener('pointerdown',function(e){
                  if(e.pointerType==='mouse'&&e.button!==0)return;
                  holdFired=false;markTarget=p;holdX=e.clientX;holdY=e.clientY;p.classList.add('mvp-hold-armed');
                  markTimer=setTimeout(function(){if(markTarget!==p)return;holdFired=true;p.classList.remove('mvp-hold-armed');markParagraph(p,pIdx);if(tg&&tg.HapticFeedback&&tg.HapticFeedback.impactOccurred){try{tg.HapticFeedback.impactOccurred('light');}catch(_){}}},HOLD_MS);
              });
              p.addEventListener('pointermove',function(e){if(markTarget!==p)return;var dx=e.clientX-holdX,dy=e.clientY-holdY;if(dx*dx+dy*dy>64)clearHold(p);});
              p.addEventListener('pointerup',function(e){var wasHold=holdFired;clearHold(p);if(wasHold){e.preventDefault();e.stopPropagation();}});
              p.addEventListener('pointercancel',function(){clearHold(p);});
          });

          if (savedIndex !== null && paragraphs[savedIndex]) {
              paragraphs[savedIndex].classList.add('bookmarked');
              paragraphs[savedIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
      }, 100);
    } catch(e) {
      pages.innerHTML = "<div class='readererror'>Gagal memuat chapter novel.</div>";
    }
  } else {
    if(!Array.isArray(c && c.file_ids) || !c.file_ids.length){
      alert("Halaman chapter belum tersedia.");
      return;
    }
    c.file_ids.forEach(function(fid, i) {
      var img = document.createElement("img");
      img.className = "readerpage";
      img.alt = p.title + " Chapter " + chapterName + " Page " + (i+1);
      img.loading = i < 2 ? "eager" : "lazy";
      img.src = fileUrl(fid);
      img.onerror = function() {
        var err = document.createElement("div");
        err.className = "readererror";
        err.textContent = "Gagal memuat halaman " + (i+1) + ".";
        img.parentNode.replaceChild(err, img);
      };
      pages.appendChild(img);
    });
  }
}

function toggleChapterMenu(e){
  if(e) e.stopPropagation();
  var menu = $("readerChapterMenu");
  if(menu) menu.classList.toggle("hidden");
}

function selectReaderChapter(projectId, index){
  var p = catalog.find(function(x) { return x.id === projectId; });
  if(!p) return;
  var chaptersArr = Array.isArray(p && p.chapters) ? p.chapters : [];
  if(!chaptersArr[index]) return;
  
  var menu = $("readerChapterMenu");
  if (menu) menu.classList.add("hidden");
  var c = chaptersArr[index];
  openReader(projectId, c.chapter, Number(c.decensored));
}

document.addEventListener("click", function(e) {
  var menu = $("readerChapterMenu");
  var wrap = menu ? menu.parentElement : null;
  if(menu && wrap && !wrap.contains(e.target)) menu.classList.add("hidden");
});

function readerInfo(projectId){
  hideReaderWatermark();
  $("reader").classList.add("hidden");
  openProject(projectId);
}
function closeReader(){
  $("progressContainer").style.display="none";
  hideReaderWatermark();
  $("reader").classList.add("hidden");
  $("detail").classList.remove("hidden");
}

function applyTheme(theme){
  var light = theme === "light";
  if (light) { document.body.classList.add("light"); } else { document.body.classList.remove("light"); }
  var btn = $("themeToggle");
  if(btn) {
    btn.innerHTML = light 
    ? "<svg width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z'></path></svg>"
    : "<svg width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='5'></circle><line x1='12' y1='1' x2='12' y2='3'></line><line x1='12' y1='21' x2='12' y2='23'></line><line x1='4.22' y1='4.22' x2='5.64' y2='5.64'></line><line x1='18.36' y1='18.36' x2='19.78' y2='19.78'></line><line x1='1' y1='12' x2='3' y2='12'></line><line x1='21' y1='12' x2='23' y2='12'></line><line x1='4.22' y1='19.78' x2='5.64' y2='18.36'></line><line x1='18.36' y1='5.64' x2='19.78' y2='4.22'></line></svg>";
  }
  try{localStorage.setItem("mvp_theme", light ? "light" : "dark")}catch(e){}
}

function toggleTheme(){
  applyTheme(document.body.classList.contains("light") ? "dark" : "light");
}

(function initTheme(){
  var theme = "dark";
  try{theme = localStorage.getItem("mvp_theme") || "dark"}catch(e){}
  applyTheme(theme);
})(); 

// FUNGSI INIT GLOBAL
(async function(){
  if(!tg){showDenied();return;}
  tg.ready();tg.expand();
  
  var platform = String((tg && tg.platform) || "").toLowerCase();
  if(!tg.initData || (platform !== "android" && platform !== "android_x" && platform !== "ios")){
    showDenied();
    return;
  }
  
  try{
    if(!(await requireAccess())) return;
    var r = await fetch("/api/catalog", {cache: "no-store", headers: accessHeaders()});
    if(r.status === 403 || r.status === 401){showDenied();return;}
    if(!r.ok) throw new Error("catalog");
    catalog = await r.json();
    $("home").classList.remove("hidden"); 
    
    renderHome();

    var startParam = (tg && tg.initDataUnsafe) ? tg.initDataUnsafe.start_param : null;
    if (startParam) {
      var p = catalog.find(function(x) { return x.id === startParam; });
      if (p) { openProject(startParam); }
    }
  }catch(e){
    if(accessDenied) return;
    $("home").classList.remove("hidden");
    $("grid").innerHTML="<p class='muted'>Library belum tersambung ke katalog.</p>";
  }
})();
</script>
