<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>MVP Library</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin:0; min-height:100%; background:#0f0f12; color:#f5f5f7; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
    .card { width:min(520px,100%); text-align:center; padding:32px 24px; border:1px solid #2b2b31; border-radius:24px; background:#17171c; }
    .icon { font-size:48px; margin-bottom:12px; }
    h1 { margin:0 0 10px; font-size:28px; }
    p { margin:0; color:#a8a8b3; line-height:1.5; }
    .hidden { display:none !important; }
    .notice { margin-top:18px; padding:14px 16px; border-radius:14px; background:#202027; color:#cfcfd8; }
    .badge { display:inline-block; margin-top:18px; padding:7px 11px; border-radius:999px; background:#25252d; color:#bdbdc8; font-size:13px; }
  </style>
</head>
<body>
  <main id="app" class="card hidden">
    <div class="icon">📚</div>
    <h1>MVP Library</h1>
    <p>Library MVP berhasil terhubung.</p>
    <span id="platformBadge" class="badge"></span>
  </main>

  <main id="blocked" class="card hidden">
    <div class="icon">🔒</div>
    <h1>Akses ditolak</h1>
    <p id="blockedText">MVP Library hanya dapat dibuka melalui aplikasi Telegram mobile.</p>
  </main>

  <script>
    (() => {
      const tg = window.Telegram?.WebApp;
      const blocked = document.getElementById("blocked");
      const app = document.getElementById("app");
      const blockedText = document.getElementById("blockedText");
      const badge = document.getElementById("platformBadge");

      if (!tg) {
        blockedText.textContent = "MVP Library hanya dapat dibuka melalui aplikasi Telegram mobile.";
        blocked.classList.remove("hidden");
        return;
      }

      tg.ready();
      tg.expand();

      const platform = String(tg.platform || "").toLowerCase();
      const initData = String(tg.initData || "");

      // Telegram mobile platforms allowed for the Library.
      const isAndroid = platform === "android";
      const isIOS = platform === "ios";
      const isMobileTelegram = isAndroid || isIOS;

      // Direct browser access and Telegram Web/Desktop are rejected.
      if (!initData || !isMobileTelegram) {
        if (platform === "android" || platform === "ios") {
          blockedText.textContent = "MVP Library hanya dapat dibuka melalui sesi Telegram yang valid.";
        } else {
          blockedText.textContent = "MVP Library hanya dapat dibuka melalui aplikasi Telegram di Android atau iPhone/iPad.";
        }
        blocked.classList.remove("hidden");
        return;
      }

      app.classList.remove("hidden");
      badge.textContent = isAndroid ? "Android • Decensored eligible" : "iOS • Standard content";
      document.body.style.background = tg.backgroundColor || "#0f0f12";
    })();
  </script>
</body>
</html>
