<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f0f12">
<title>MVP Library</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0f0f12;color:#f4f4f5;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.wrap{max-width:900px;margin:auto;padding:20px}
#reader.wrap{width:100vw;max-width:none;margin:0;padding:0;overflow-x:hidden}
#readerContent{width:100vw;max-width:none;margin:0!important;padding:0}
#reader .back{position:fixed;top:10px;left:10px;z-index:30;opacity:.82}
@media(max-width:900px){
  #reader.wrap{width:100vw}
}
header{padding:8px 0 18px}h1,h2,h3,p{margin:0}.muted{color:#a6a6b0}.search{width:100%;padding:13px 15px;border:1px solid #303038;border-radius:14px;background:#19191f;color:#fff;font-size:16px;margin:12px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px}.card{border:1px solid #2b2b31;border-radius:18px;overflow:hidden;background:#18181d;cursor:pointer}
.cover{width:100%;aspect-ratio:2/3;object-fit:cover;background:#24242a}.cardbody{padding:12px}.title{font-weight:700}.btn{display:inline-block;border:0;border-radius:10px;padding:9px 12px;background:#30303a;color:#fff;text-decoration:none}
.back{border:0;background:#24242a;color:#fff;padding:9px 12px;border-radius:10px}.detailcover{width:min(260px,75%);aspect-ratio:2/3;object-fit:cover;border-radius:16px;margin-top:16px}
.chapters{display:flex;flex-direction:column;gap:9px;margin-top:14px}.chapter{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;background:#19191f;border:1px solid #2b2b31;border-radius:12px}
.notice{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}.hidden{display:none}
.readerhead{position:sticky;top:0;z-index:5;padding:10px 12px;background:#0f0f12e6;backdrop-filter:blur(10px)}
.readerpages{display:flex;flex-direction:column;align-items:center;gap:0;margin:0;padding:0;width:100vw;max-width:100vw;overflow-x:hidden}
.readerpage{display:block;width:100vw;max-width:100vw;height:auto;margin:0;padding:0;background:#000;object-fit:contain}
.readererror{padding:18px;text-align:center;border:1px solid #55333a;border-radius:12px;background:#24181b;margin-top:12px}
.reader-nav{display:flex;align-items:center;gap:8px;padding:14px 10px calc(14px + env(safe-area-inset-bottom));background:#0f0f12;border-top:1px solid #2b2b31}
.reader-nav .navbtn{flex:1;min-width:0;text-align:center;border:0;border-radius:10px;padding:11px 8px;background:#24242a;color:#fff;font-weight:700}
.reader-nav .commentbtn{flex:1.3}
.reader-nav .disabled{opacity:.35;pointer-events:none}
.reader-watermark{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;pointer-events:none;text-align:center;line-height:1.15;opacity:.34;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.75);white-space:nowrap;font-weight:700}
.reader-watermark .wm-title{font-size:18px}
.reader-watermark .wm-user{font-size:12px;font-weight:600;margin-top:3px}
</style>
</head>
<body oncontextmenu="return false">
<div id="gate" class="notice hidden"><div><h2>🔒 Akses ditolak</h2><p class="muted" style="margin-top:8px">MVP Library hanya dapat dibuka melalui Telegram Android atau iOS.</p></div></div>
<div id="home" class="wrap hidden">
<header><h1>📚 MVP Library</h1><p class="muted">Pilih project untuk melihat detail dan chapter.</p></header>
<input id="search" class="search" placeholder="Cari PJ...">
<div id="grid" class="grid"></div>
</div>
<div id="detail" class="wrap hidden">
<button class="back" onclick="showHome()">← Kembali</button>
<div id="detailContent" style="margin-top:18px"></div>
</div>
<div id="reader" class="wrap hidden">
  <button class="back" onclick="closeReader()">← Kembali</button>
  <div id="readerContent" style="margin-top:18px"></div>
  <div id="readerWatermark" class="reader-watermark hidden">
    <div class="wm-title">👑 MVP</div>
    <div id="readerWatermarkUser" class="wm-user"></div>
  </div>
</div>
<script>
const tg=window.Telegram?.WebApp;
let catalog=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const API_BASE=location.origin;
const fileUrl=fileId=>`${API_BASE}/api/file?file_id=${encodeURIComponent(fileId)}&init_data=${encodeURIComponent(tg?.initData||"")}`;
let accessUser=null;
let accessDenied=false;

function accessHeaders(){
  return {"X-Telegram-Init-Data":tg?.initData||""};
}

function showDenied(){
  accessDenied=true;
  $("home").classList.add("hidden");
  $("detail").classList.add("hidden");
  $("reader").classList.add("hidden");
  $("gate").classList.remove("hidden");
  $("gate").innerHTML=`<div><h2>🔒 Akses Ditolak</h2><p class="muted" style="margin-top:8px">Anda bukan bagian dari MVP</p><button class="btn" style="margin-top:16px" onclick="tg?.close()">Kembali ke Telegram</button></div>`;
}

async function requireAccess(){
  if(accessDenied) return false;
  const r=await fetch("/api/access",{cache:"no-store",headers:accessHeaders()});
  if(r.status===403 || r.status===401){
    showDenied();
    return false;
  }
  if(!r.ok) throw new Error("access");
  const data=await r.json();
  accessUser=data.user||null;
  return true;
}
function deny(){ $("gate").classList.remove("hidden"); }
function showHome(){ $("detail").classList.add("hidden"); $("home").classList.remove("hidden"); }
function render(list){
  $("grid").innerHTML=list.length?list.map(p=>`
    <article class="card" onclick="openProject('${esc(p.id)}')">
      ${p.cover_file_id
        ? `<img class="cover" src="${fileUrl(p.cover_file_id)}" alt="${esc(p.title)}" loading="lazy" onerror="this.style.display='none'">`
        : `<div class="cover"></div>`}
      <div class="cardbody"><div class="title">${esc(p.title)}</div>
      <div class="muted" style="margin-top:5px">${(p.chapters||[]).length} chapter</div></div>
    </article>`).join(""):"<p class='muted'>Belum ada PJ.</p>";
}
async function openProject(id){
  if(!(await requireAccess())) return;
  const p=catalog.find(x=>x.id===id); if(!p)return;
  $("home").classList.add("hidden"); $("detail").classList.remove("hidden");
  const comment=p.comment_link?`<p style="margin:16px 0"><a class="btn" href="${esc(p.comment_link)}">💬 Komentar di Lapak</a></p>`:"";
  const cover=p.cover_file_id
    ? `<img class="detailcover" src="${fileUrl(p.cover_file_id)}" alt="${esc(p.title)}" onerror="this.style.display='none'">`
    : "";
  $("detailContent").innerHTML=`
    ${cover}
    <h1 style="margin-top:16px">${esc(p.title)}</h1>
    <p class="muted" style="margin-top:8px;white-space:pre-line">${esc(p.description)}</p>
    ${comment}
    <h2 style="margin-top:24px">Chapters</h2>
    <div class="chapters">${(p.chapters||[]).map(c=>`
      <div class="chapter"><span>Chapter ${esc(c.chapter)} ${c.decensored?"🔞":""}</span>
      <button class="btn" onclick="openReader('${esc(p.id)}','${esc(c.chapter)}',${c.decensored?'true':'false'})">Baca</button></div>`).join("")}</div>`;
}
function getTelegramIdentity(){
  const u=tg?.initDataUnsafe?.user;
  if(!u) return {id:"", username:""};
  return {
    id:String(u.id||""),
    username:u.username ? `@${u.username}` : ""
  };
}

function showReaderWatermark(){
  const u=getTelegramIdentity();
  $("readerWatermarkUser").textContent=[u.id,u.username].filter(Boolean).join(" | ");
  $("readerWatermark").classList.remove("hidden");
}

function hideReaderWatermark(){
  $("readerWatermark").classList.add("hidden");
}

function chapterIndex(projectId, chapterName, decensored){
  const p=catalog.find(x=>x.id===projectId);
  if(!p) return -1;
  return (p.chapters||[]).findIndex(c=>String(c.chapter)===String(chapterName) && Boolean(c.decensored)===Boolean(decensored));
}

async function openChapter(projectId, index){
  if(!(await requireAccess())) return;
  const p=catalog.find(x=>x.id===projectId);
  if(!p || !p.chapters?.[index]) return;
  const c=p.chapters[index];
  openReader(projectId, c.chapter, Boolean(c.decensored));
}

function chapterCommentLink(p){
  return p?.comment_link || "";
}

async function openReader(projectId, chapterName, decensored){
  if(!(await requireAccess())) return;
  const p=catalog.find(x=>x.id===projectId);
  if(!p)return;
  const c=(p.chapters||[]).find(x=>String(x.chapter)===String(chapterName) && Boolean(x.decensored)===Boolean(decensored));
  if(!c || !Array.isArray(c.file_ids) || !c.file_ids.length){
    alert("Halaman chapter belum tersedia.");
    return;
  }

  $("home").classList.add("hidden");
  $("detail").classList.add("hidden");
  $("reader").classList.remove("hidden");
  showReaderWatermark();

  $("readerContent").innerHTML=`
    <div class="readerhead">
      <h2>${esc(p.title)} · Chapter ${esc(chapterName)}${decensored?" 🔞":""}</h2>
    </div>
    <div id="readerPages" class="readerpages"></div>
    <div id="readerNav" class="reader-nav"></div>`;

  const pages=$("readerPages");

  const idx=chapterIndex(projectId, chapterName, decensored);
  const prevIndex=idx>0 ? idx-1 : -1;
  const nextIndex=(idx>=0 && idx<(p.chapters||[]).length-1) ? idx+1 : -1;
  const commentUrl=chapterCommentLink(p);

  $("readerNav").innerHTML=`
    <button class="navbtn ${prevIndex<0?"disabled":""}" ${prevIndex<0?"disabled":""}
      onclick="openChapter('${esc(p.id)}',${prevIndex})">« Ch</button>
    <button class="navbtn commentbtn ${commentUrl?"":"disabled"}" ${commentUrl?`onclick="location.href='${esc(commentUrl)}'"`:"disabled"}>
      💬 Comment
    </button>
    <button class="navbtn ${nextIndex<0?"disabled":""}" ${nextIndex<0?"disabled":""}
      onclick="openChapter('${esc(p.id)}',${nextIndex})">Ch »</button>
  `;

  c.file_ids.forEach((fid,i)=>{
    const img=document.createElement("img");
    img.className="readerpage";
    img.alt=`${p.title} Chapter ${chapterName} Page ${i+1}`;
    img.loading=i<2?"eager":"lazy";
    img.src=fileUrl(fid);
    img.onerror=()=>{
      const err=document.createElement("div");
      err.className="readererror";
      err.textContent=`Gagal memuat halaman ${i+1}.`;
      img.replaceWith(err);
    };
    pages.appendChild(img);
  });
}

function closeReader(){
  hideReaderWatermark();
  $("reader").classList.add("hidden");
  $("detail").classList.remove("hidden");
}

$("search").oninput=e=>{const q=e.target.value.toLowerCase();render(catalog.filter(p=>p.title.toLowerCase().includes(q)));};
(async()=>{
  if(!tg){deny();return;}
  tg.ready();tg.expand();
  const platform=String(tg.platform||"").toLowerCase();
  if(!tg.initData || !["android","android_x","ios"].includes(platform)){deny();return;}
  try{
    if(!(await requireAccess())) return;
    const r=await fetch("/api/catalog",{cache:"no-store",headers:accessHeaders()});
    if(r.status===403 || r.status===401){showDenied();return;}
    if(!r.ok)throw new Error("catalog");
    catalog=await r.json();
    $("home").classList.remove("hidden"); render(catalog);
  }catch(e){
    if(accessDenied) return;
    $("home").classList.remove("hidden");
    $("grid").innerHTML="<p class='muted'>Library belum tersambung ke katalog.</p>";
  }
})();
</script>
</body>
</html>
